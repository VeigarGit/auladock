services:
  db:
    image: mysql:8.0
    container_name: cadastro-db
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"   # root com senha aleatória (ninguém precisa usar)
      MYSQL_DATABASE: cadastro
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    volumes:
      - dados_mysql:/var/lib/mysql       # volume persistente
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: cadastro-web
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: db                     # o nome do serviço vira o "endereço"
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
      MYSQL_DATABASE: cadastro
    depends_on:
      db:
        condition: service_healthy       # só sobe o web quando o db estiver pronto
    restart: unless-stopped

volumes:
  dados_mysql:                           # declara o volume nomeado
