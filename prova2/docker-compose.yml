services:
  db:
    image: mysql:8.0
    container_name: prova2_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha_segura
      MYSQL_DATABASE: cadastro_db 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: prova2_app
    restart: on-failure                 
    ports:
      - "5000:5000"                     
    depends_on:
      - db                           

# Declaração do volume para não perder os dados salvos quando reiniciar os container
volumes:
  mysql_data: 