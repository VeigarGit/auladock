services:
  flask:
    build: .
    container_name: flask_app

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: username
      MONGO_PASSWORD: password

    networks:
      - backend

  mongodb:
    image: mongo:latest
    container_name: mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongo_data:/data/db

    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend: