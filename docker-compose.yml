services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tarefas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tarefas']
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build:
      context: ./back
    environment:
      PORT: 4000
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
      TYPEORM_USERNAME: postgres
      TYPEORM_PASSWORD: 123456
      TYPEORM_DATABASE: tarefas
      TYPEORM_SYNCHRONIZE: 'true'
      TYPEORM_LOGGING: 'true'
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  front:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - back



volumes:
  postgres_data:
  front_node_modules:
