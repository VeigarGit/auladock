version: '3.8'
services:
  db_final:
    image: mysql:8.0
    container_name: mysql_final
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: user_app
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - db_data_final:/var/lib/mysql
    command: --innodb_flush_method=fsync --innodb_log_file_size=50M

  web_final:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: flask_final
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db_final
      - DB_USER=user_app
      - DB_PASSWORD=apppassword
      - DB_NAME=app_db
    depends_on:
      - db_final

volumes:
  db_data_final: