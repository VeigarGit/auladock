services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tarefas
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tarefas']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tarefas_net

  back:
    build:
      context: .
    environment:
      PORT: 4000
      JWT_SECRET: local-dev-secret
      TYPEORM_HOST: postgres
      TYPEORM_PORT: 5432
      TYPEORM_USERNAME: postgres
      TYPEORM_PASSWORD: 123456
      TYPEORM_DATABASE: tarefas
      TYPEORM_SYNCHRONIZE: 'true'
      TYPEORM_LOGGING: 'true'
      CORS_ORIGIN: http://localhost:5178
    ports:
      - '4001:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tarefas_net

  adminer:
    image: adminer:4
    ports:
      - '8081:8080'
    depends_on:
      - postgres
    networks:
      - tarefas_net

volumes:
  postgres_data:

networks:
  tarefas_net:
    name: tarefas-shared
    driver: bridge
